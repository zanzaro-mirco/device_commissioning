name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # I vettori sono il contratto fra firmware e app, e si generano da uno script.
  # Se qualcuno cambia lo script e dimentica di rigenerarli, o li ritocca a mano,
  # il contratto che i test leggono non è più quello dichiarato: qui si ferma.
  vettori:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: I vettori sono quelli generati
        run: |
          python protocol/tool/generate_vectors.py
          git diff --exit-code protocol/vectors

  # Il nucleo in C, costruito e provato sul PC con gcc. In locale gira con MSVC:
  # due compilatori diversi sugli stessi sorgenti trovano avvisi diversi.
  dc_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Costruzione
        run: |
          cmake -S native/dc_core -B native/dc_core/out -DCMAKE_BUILD_TYPE=Debug
          cmake --build native/dc_core/out

      - name: Test
        run: ctest --test-dir native/dc_core/out --output-on-failure

  # Il firmware, costruito due volte con l'immagine ufficiale di ESP-IDF: quello
  # da installare e quello di debug con il comando di guasto. Il nucleo in C è lo
  # stesso del lavoro dc_core, qui compilato per l'ESP32-S3. La prova con la
  # scheda vera non gira in CI: è documentata in firmware/README.md.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Il controllo su sdkconfig ferma una configurazione che accendesse il
      # comando di guasto nel firmware da installare.
      - name: Firmware da installare
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
          command: idf.py build && ! grep -q ^CONFIG_DC_DEBUG_COMMANDS=y sdkconfig

      - name: Firmware di debug
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
          command: >-
            idf.py -B build-debug -D SDKCONFIG=build-debug/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.debug" build
            && grep -q ^CONFIG_DC_DEBUG_COMMANDS=y build-debug/sdkconfig

      # I binari pronti da caricare con esptool, senza installare ESP-IDF:
      # flasher_args.json dice a quale indirizzo va ciascun file.
      - name: Binari del firmware da installare
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            firmware/build/flasher_args.json
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/centralina.bin
          if-no-files-found: error

      - name: Binari del firmware di debug
        uses: actions/upload-artifact@v7
        with:
          name: firmware-debug
          path: |
            firmware/build-debug/flasher_args.json
            firmware/build-debug/bootloader/bootloader.bin
            firmware/build-debug/partition_table/partition-table.bin
            firmware/build-debug/centralina.bin
          if-no-files-found: error

  # Il protocollo lato app: Dart puro, senza Flutter. Legge gli stessi vettori
  # del C, quindi gira dalla cartella del pacchetto con il repository intero.
  commissioning_protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/commissioning_protocol
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dipendenze
        run: dart pub get

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisi
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  # Il plugin: Dart, codice generato da Pigeon, Kotlin (test JVM della coda
  # GATT) e il C compilato con l'NDK dentro l'APK dell'esempio.
  ble_bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ble_bridge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dipendenze
        run: flutter pub get

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test pigeons example/lib

      - name: Analisi
        run: flutter analyze --fatal-infos

      # Il codice generato è versionato, così chi legge il repository lo vede.
      # Se qualcuno cambia il contratto e dimentica di rigenerarlo, Dart e
      # Kotlin parlano due lingue diverse: qui si ferma.
      - name: Il codice di Pigeon è aggiornato
        run: |
          dart run pigeon --input pigeons/ble_api.dart
          dart format lib/src/ble_api.g.dart
          git diff --exit-code -- lib/src/ble_api.g.dart android/src/main/kotlin

      - name: Test Dart
        run: flutter test

      - name: L'APK dell'esempio si costruisce (Kotlin, Pigeon, NDK)
        working-directory: packages/ble_bridge/example
        run: flutter build apk --debug

      - name: Test JVM della coda GATT
        working-directory: packages/ble_bridge/example/android
        run: ./gradlew :ble_bridge:testDebugUnitTest

  # L'app: Cubit, pagine e l'esito incerto provati contro la centralina finta,
  # più l'APK, che mette insieme app, plugin, Kotlin e C.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dipendenze
        run: flutter pub get

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisi
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: L'APK si costruisce
        run: flutter build apk --debug

  # Il C di native/dc_core compilato per Android e chiamato via JNI, con i
  # vettori del protocollo. Sulla JVM la libreria nativa non si carica: serve
  # un emulatore, lo stesso allestimento dei test di integrazione di pos_sync.
  ble_bridge_jni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configurazione Gradle dell'esempio
        working-directory: packages/ble_bridge/example
        run: |
          flutter pub get
          flutter build apk --config-only

      # Senza KVM l'emulatore parte in emulazione software e impiega minuti
      # invece di secondi, quando non scade del tutto.
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test del JNI su emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          working-directory: packages/ble_bridge/example/android
          script: ./gradlew :ble_bridge:connectedDebugAndroidTest
