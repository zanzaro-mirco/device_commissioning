name: commissioning_app
description: "L'app dell'installatore: trova, collega e configura una centralina via Bluetooth LE."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  ble_bridge:
    path: ../packages/ble_bridge
  commissioning_protocol:
    path: ../packages/commissioning_protocol
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
